name: hax-monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_forward_latest:
        description: Forward one latest incoming Hax notification without Bark or state changes
        type: boolean
        default: false
      test_bark:
        description: Also send Bark when testing the latest notification
        type: boolean
        default: false

concurrency: hax-monitor

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      TG_FORWARD_TO: haxeu_musebot
      TEST_FORWARD_LATEST: ${{ inputs.test_forward_latest || false }}
      TEST_BARK: ${{ inputs.test_bark || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q telethon

      - run: python -m unittest -q

      - name: Monitor hax-eu
        id: eu
        continue-on-error: true
        run: python monitor.py
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          ACCOUNT_LABEL: hax-eu

      - name: Monitor hax-us3
        id: us3
        continue-on-error: true
        run: python monitor.py
        env:
          TG_SESSION: ${{ secrets.TG_SESSION_2 }}
          ACCOUNT_LABEL: hax-us3
          STATE_FILE: state-hax-us3.json
          INITIALIZE_LATEST: 'true'

      - name: commit state
        if: ${{ always() }}
        run: |
          git add state.json
          if [ -f state-hax-us3.json ]; then git add state-hax-us3.json; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "update state"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0 || sleep 2
            done
            echo "Failed to push state.json due to concurrent push, will sync in next run"
            exit 1
          fi

      - name: Report delivery failures
        if: ${{ always() && (steps.eu.outcome == 'failure' || steps.us3.outcome == 'failure') }}
        run: exit 1
